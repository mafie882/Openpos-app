name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regenerate Gradle wrapper
        # The zip delivered to the user didn't include the small binary
        # gradle-wrapper.jar (it couldn't be downloaded from that
        # environment), so the runner's own Gradle install regenerates a
        # correct wrapper here before building.
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openpos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
